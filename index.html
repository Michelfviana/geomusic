<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoMusic</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage" aria-label="Detector GeoMusic">
        <div class="video-panel">
          <video id="camera" autoplay playsinline muted></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <canvas id="frame" aria-hidden="true"></canvas>
          <div class="status-pill" id="status">Câmera desligada</div>
        </div>

        <aside class="control-panel">
          <header>
            <p class="eyebrow">Árvore de Decisão + Webcam</p>
            <h1>GeoMusic</h1>
            <p class="subtitle">
              Mostre um círculo, quadrado ou triângulo para transformar formas em música.
            </p>
          </header>

          <div class="prediction-card" id="predictionCard">
            <span class="shape-icon" id="shapeIcon">?</span>
            <div>
              <p class="label">Forma reconhecida</p>
              <strong id="shapeName">Aguardando câmera</strong>
            </div>
          </div>

          <div class="controls" aria-label="Controles">
            <button id="startButton" class="primary-button" type="button">Iniciar câmera</button>
            <button id="soundButton" type="button">Som ligado</button>
            <button id="clearButton" type="button">Limpar sequência</button>
          </div>

          <div class="meter-grid" aria-label="Características extraídas">
            <div>
              <span>Circularidade</span>
              <meter id="circularityMeter" min="0" max="1" value="0"></meter>
            </div>
            <div>
              <span>Cantos</span>
              <meter id="aspectMeter" min="0" max="1" value="0"></meter>
            </div>
            <div>
              <span>Consistência</span>
              <meter id="extentMeter" min="0" max="1" value="0"></meter>
            </div>
          </div>

          <div class="sequence-panel">
            <div class="section-heading">
              <h2>Sequência</h2>
              <span id="sequenceCount">0 notas</span>
            </div>
            <div class="sequence" id="sequence"></div>
          </div>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
